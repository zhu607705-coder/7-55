Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "AllowMouseOpenFail" "true"
 Option "DontVTSwitch" "true"
EndSection
Section "Device"
 Identifier "DummyVideoCard"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "DummyMonitor"
 HorizSync 5.0-1000.0
 VertRefresh 5.0-200.0
 Modeline "1280x960_60.00" 101.34 1280 1360 1496 1712 960 961 964 987 -HSync +VSync
EndSection
Section "Screen"
 Identifier "DummyScreen"
 Device "DummyVideoCard"
 Monitor "DummyMonitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1280x960_60.00"
  Virtual 1280 1280
 EndSubSection
EndSection
