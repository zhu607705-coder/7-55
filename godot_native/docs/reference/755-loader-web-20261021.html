(()=>{const $=id=>document.getElementById(id),page=$('page');let state='downloading',received=0,total=0,paused=false;const labels={downloading:['正在准备这一天…','正在下载游戏文件'],verifying:['正在检查游戏文件…','下载已完成，请稍候'],ready:['清晨已经准备好了。','可以进入游戏'],error:['加载遇到了一点问题。','请检查网络后重试'],starting:['正在走进寝室…','游戏启动中，请稍候']};function render(){const [head,detail]=labels[state];$('stateText').textContent=head;$('note').textContent=detail;$('enter').classList.toggle('hide',state!=='ready');$('retry').classList.toggle('hide',state!=='error');$('track').classList.toggle('hide',state!=='downloading');$('percent').textContent=state==='downloading'&&total>0?Math.floor(received/total*100)+'%':'';if(state==='downloading'&&total>0){const p=Math.min(100,Math.max(0,received/total*100));$('fill').style.width=p+'%';$('track').setAttribute('aria-valuenow',String(Math.floor(p)))}$('note').textContent=state==='downloading'&&total>0?`${detail} · ${(received/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MB`:detail}function setState(s){if(!(s in labels))return;state=s;render()}function progress(r,t){received=Math.max(0,Number(r)||0);total=Math.max(0,Number(t)||0);setState('downloading')};$('pause').onclick=()=>{paused=!paused;page.classList.toggle('paused',paused);$('pause').textContent=paused?'继续动画':'暂停动画';$('pause').setAttribute('aria-pressed',String(paused))};document.addEventListener('visibilitychange',()=>{page.classList.toggle('paused',paused||document.hidden)});$('retry').onclick=()=>window.dispatchEvent(new Event('loader-retry'));$('enter').onclick=()=>{if(state!=='ready')return;setState('starting');window.dispatchEvent(new Event('loader-enter'))};window.LoaderUI={progress,setState};render()})();
