<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目展示交互测试</title><link rel="stylesheet" href="/style.css"><body><main style="padding:32px"><h1>项目展示交互测试</h1><p>仅验证真实 DOM 对话框，不是建筑场景预览。</p><button id="poster">打开现有海报内容</button><button id="monitor">打开未配置工位</button><p id="result" role="status"></p></main><dialog id="project-display-dialog" aria-labelledby="project-display-title"><form method="dialog"><button class="close" aria-label="关闭项目展示">返回空间</button></form><h2 id="project-display-title"></h2><div id="project-display-content"></div></dialog><script type="module">import {createProjectDisplay} from '/project_displays.js';const config=await(await fetch('/assets/exhibition_config.json')).json();const result=document.getElementById('result');const ui=createProjectDisplay({config,onClose:()=>{result.textContent='已关闭，回到原页面';document.getElementById('poster').focus();}});document.getElementById('poster').onclick=()=>ui.open({id:'flc/f4/poster/seminar_1',kind:'poster'});document.getElementById('monitor').onclick=()=>ui.open({id:'flc/f3/object/unconfigured',kind:'monitor'});</script></body></html>
