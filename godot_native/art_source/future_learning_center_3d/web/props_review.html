<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来学习中心 · 六件样板检查</title><link rel="icon" href="data:,"><link rel="stylesheet" href="props_review.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script></head>
<body><header><h1>六件样板检查</h1><p>独立评审入口，不替换主建筑或游戏。设备为方案模型，不是厂家外观复刻。</p></header>
<main><section class="viewer" aria-label="三维样板"><canvas id="scene" tabindex="0" aria-label="拖动旋转，滚轮或双指缩放；也可使用下方视角按钮"></canvas><p id="status" role="status">正在初始化三维检查器…</p><div class="view-actions"><button id="fit" type="button">完整查看</button><button id="near" type="button">近看</button><button id="front" type="button">正面</button><button id="side" type="button">侧面</button><button id="top" type="button">顶部</button></div></section>
<aside><label for="asset">物件</label><select id="asset"></select><div class="row"><div><label for="lod">几何档位</label><select id="lod"><option value="auto">自动（投影直径）</option><option value="0">LOD 0 · 近</option><option value="1">LOD 1 · 中</option><option value="2">LOD 2 · 远</option></select></div><div><label for="count">共享实例</label><select id="count"><option value="1">1 件</option><option value="3">3 件</option><option value="6">6 件</option></select></div></div><label class="check"><input id="grid" type="checkbox" checked> 显示 100 mm 网格</label><button id="retry" type="button" hidden>重试此件</button><p id="stats"></p><h2 id="name">尺寸与依据</h2><p>以下为沿用的设计 / 参照尺寸，不是本轮现场实测。</p><p id="dimensions"></p><p id="source"></p><p id="note"></p><p><a id="source-doc" href="../sources/small_props_batch_20261102.md">查看建模记录</a></p><details><summary>材质参数与边界</summary><p>全部为参数 PBR，没有伪称完整贴图。环境反射来自本地 RoomEnvironment；玻璃为 glTF 透射，不等同于 Blender CPU 渲染。</p><ul id="materials"></ul></details><p class="boundary">本入口尚未通过真实浏览器画面、手机和 GPU 验收。若 WebGL 不可用，可阅读尺寸和建模记录。需以 HTTP 服务打开整个工程目录。</p></aside></main><noscript>请启用 JavaScript。模型来源可查看 sources 下两批建模记录。</noscript><script type="module" src="props_review.js"></script></body></html>
