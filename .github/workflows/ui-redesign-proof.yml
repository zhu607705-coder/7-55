name: Native UI visual proof
on:
  push:
    branches: [codex/campus-ui-system-20261021]
    paths: ['godot_native/**', '.github/workflows/ui-redesign-proof.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - name: Preserve capture harness and select source
        run: |
          cp godot_native/tests/capture_ui_redesign.gd /tmp/capture_ui_redesign.gd
          cp godot_native/tests/capture_phone_symbols.gd /tmp/capture_phone_symbols.gd
          cp godot_native/tests/capture_selected_worlds.gd /tmp/capture_selected_worlds.gd
          cp godot_native/tests/capture_selected_dialogues.gd /tmp/capture_selected_dialogues.gd
          if [ '${{ matrix.source }}' = baseline ]; then
            git fetch --depth=1 origin f963d47cbe31e5d799b405e36d4ad68cd97546fa
            git checkout --detach f963d47cbe31e5d799b405e36d4ad68cd97546fa
          fi
          cp /tmp/capture_ui_redesign.gd godot_native/tests/capture_ui_redesign.gd
          cp /tmp/capture_phone_symbols.gd godot_native/tests/capture_phone_symbols.gd
          cp /tmp/capture_selected_worlds.gd godot_native/tests/capture_selected_worlds.gd
          cp /tmp/capture_selected_dialogues.gd godot_native/tests/capture_selected_dialogues.gd
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing pinned native renderer
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Synchronize and import actual game assets
        run: |
          node godot_native/tools/sync_source.mjs
          GODOT_TEST_REPORT=import-report.json node godot_native/tools/validate_native.mjs --filter 'Godot asset import and editor parse'
      - name: Verify bundled fonts and dynamic phone icons
        if: matrix.source == 'candidate'
        run: |
          node godot_native/tools/test_ui_font_pack.mjs
          node godot_native/tools/test_phone_icon_pack.mjs
      - name: Capture actual desktop and compact interfaces
        run: |
          mkdir -p "/tmp/755-ui-profile"/{data,config,cache,state}
          export XDG_DATA_HOME="/tmp/755-ui-profile/data" XDG_CONFIG_HOME="/tmp/755-ui-profile/config"
          export XDG_CACHE_HOME="/tmp/755-ui-profile/cache" XDG_STATE_HOME="/tmp/755-ui-profile/state"
          export GODOT_TEST_USER_DATA_DIR="$XDG_DATA_HOME/SevenFiftyFiveNative"
          mkdir -p "$GODOT_TEST_USER_DATA_DIR"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/ui-proof"
          mkdir -p "$UI_CAPTURE_DIR"
          git rev-parse HEAD > "$UI_CAPTURE_DIR/source-sha.txt"
          timeout 180 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_ui_redesign.gd 2>&1 | tee "$UI_CAPTURE_DIR/render.log"
          test -f "$UI_CAPTURE_DIR/captures.json"
          timeout 120 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_phone_symbols.gd 2>&1 | tee "$UI_CAPTURE_DIR/symbol-render.log"
          test -f "$UI_CAPTURE_DIR/symbol-captures.json"
          timeout 240 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_selected_worlds.gd 2>&1 | tee "$UI_CAPTURE_DIR/selected-world-render.log"
          test -f "$UI_CAPTURE_DIR/selected-world-captures.json"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/ui-proof/dialogues"
          mkdir -p "$UI_CAPTURE_DIR"
          timeout 240 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_selected_dialogues.gd 2>&1 | tee "$UI_CAPTURE_DIR/render.log"
          test -f "$UI_CAPTURE_DIR/captures.json"
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:" "$UI_CAPTURE_DIR/render.log"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/ui-proof"
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:" "$UI_CAPTURE_DIR/selected-world-render.log"
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:" "$UI_CAPTURE_DIR/symbol-render.log"
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:" "$UI_CAPTURE_DIR/render.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-proof-${{ matrix.source }}
          path: |
            ui-proof/
            import-report.json
          if-no-files-found: error
