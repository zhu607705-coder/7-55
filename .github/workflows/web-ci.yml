name: Web CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Verify web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify critical gameplay behavior
        run: node scripts/run-test-suite.mjs critical

      - name: Verify extended authoring contracts
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/run-test-suite.mjs extended

      - name: Ensure FFmpeg audio validation tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Verify Chapter 3 audio contract
        run: npm run audio:chapter3:verify

      - name: Verify Chapter 3.5 voice memos
        run: npm run audio:chapter3-interlude-voice-memos:verify

      - name: Verify campus map contract
        run: npm run map:zijingang

      - name: Verify facing-agnostic RPG interactions
        run: npm run verify:rpg-facing-agnostic

      - name: Verify Chapter 4 7:55 assets
        run: npm run chapter4:validate-assets

      - name: Verify Chapter 4 7:55 story
        run: npm run chapter4:validate-story

      - name: Verify Chapter 4 7:55 topology
        run: npm run chapter4:validate-topology

      - name: Verify Chapter 4 7:55 runtime
        run: npm run chapter4:validate-runtime

      - name: Verify Chapter 4 7:55 Task 14 contract
        run: npm run chapter4:validate-task14

      - name: Type-check source
        run: npm run typecheck

      - name: Build production bundle
        run: npm exec -- vite build

      - name: Smoke-test production bundle in headless Chromium
        run: node scripts/verify-browser-smoke.mjs

      - name: Build offline single-file demo
        run: npm exec -- vite build --mode demo

      - name: Verify offline single-file artifact
        run: npm run verify:single
