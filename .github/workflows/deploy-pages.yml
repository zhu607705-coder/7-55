            --bundle-dir "$RUNNER_TEMP/godot-web-inputs" \
            --receipt-sha "$EXPECTED_RECEIPT_SHA" \
            --producer-attempt "$EXPECTED_PRODUCER_ATTEMPT" \
            --output-receipt godot_native/exports/verification/verified-library-inputs.json

      - name: Accept actual library boundary input for this profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-library-qa-site" godot_native/exports/verification/web_library
          ln -s "$RUNNER_TEMP/godot-web-inputs/web-release" "$RUNNER_TEMP/godot-library-qa-site/7-55"
          python3 -m http.server 5209 --bind 127.0.0.1 --directory "$RUNNER_TEMP/godot-library-qa-site" > godot_native/exports/verification/web_library/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:5209/7-55/build-manifest.json
          godot_web_chrome="$(command -v google-chrome || command -v chromium)"
          node godot_native/tools/verify_web_export.mjs \
            --url http://127.0.0.1:5209/7-55/ \
            --export-dir "$RUNNER_TEMP/godot-web-inputs/web-release" \
            --output godot_native/exports/verification/web_library \
            --scenarios library --only "$ACCEPTANCE_PROFILE" \
            --fixtures "$RUNNER_TEMP/godot-web-inputs/controller-earned" \
            --chrome "$godot_web_chrome" \
            --chrome-arg --use-angle=swiftshader \
            --chrome-arg --enable-unsafe-swiftshader \
            --boot-timeout 180000 2>&1 | tee godot_native/exports/verification/web_library/acceptance.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const directory = 'godot_native/exports/verification/web_library';
          const report = JSON.parse(fs.readFileSync(`${directory}/web-acceptance.json`, 'utf8'));
          const inputBundle = JSON.parse(fs.readFileSync('godot_native/exports/verification/verified-library-inputs.json', 'utf8'));
          const provenance = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/godot-web-inputs/controller-earned/fixture-provenance.json`, 'utf8'));
          const profile = {'desktop-1280': [1280, 720, false, 1], 'touch-390': [390, 844, true, 1]}[process.env.ACCEPTANCE_PROFILE];
          const expectedFiles = ['before_library_rule_read.json', 'before_library_022_opening.json'];
          const inputs = provenance.libraryInputs?.fixtures;
          const runnerSha256 = createHash('sha256').update(fs.readFileSync('godot_native/tools/verify_web_export.mjs')).digest('hex');
          if (!profile || report.scenarios !== 'library' || !report.passed || report.exportManifest?.sourceCommit !== process.env.GITHUB_SHA || report.exportManifest?.engine !== '4.7.1.stable.official' || report.runnerSha256 !== runnerSha256 || report.cases?.length !== 1) throw Error('Missing exact-source library browser case');
          if (inputBundle.verified !== true || inputBundle.source?.checkedOutCommit !== process.env.GITHUB_SHA || inputBundle.receiptSha !== process.env.EXPECTED_RECEIPT_SHA || inputBundle.producerAttempt !== process.env.EXPECTED_PRODUCER_ATTEMPT || JSON.stringify(provenance.source) !== JSON.stringify(inputBundle.source)) throw Error('Library acceptance used different producer inputs');
          if (provenance.libraryInputs?.recorder !== 'res://tests/library_continuity_recorder.gd' || !Number.isInteger(provenance.libraryInputs?.checks) || provenance.libraryInputs.checks <= 0 || !Array.isArray(inputs) || JSON.stringify(inputs.map(input => input.fixture)) !== JSON.stringify(expectedFiles)) throw Error('Missing earned library boundary provenance');
          const item = report.cases[0], library = item.library;
          if (item.id !== process.env.ACCEPTANCE_PROFILE || JSON.stringify([item.width, item.height, item.touch, item.dpr]) !== JSON.stringify(profile) || !item.passed || !item.renderer?.webgl2) throw Error('Wrong actual library browser profile');
          if (!library || !['completed', 'unreadReopen', 'explicitRead', 'reload'].every(key => library[key] === true) || library.handoff !== 'original skip-to-arrival button then ordinary return-to-campus' || library.fixtureBoundary !== 'controller-earned; not manual spatial navigation' || !library.dialogueSamples?.length) throw Error('Incomplete library boundary continuity');
          for (const input of inputs) {
            const bytes = fs.readFileSync(`${process.env.RUNNER_TEMP}/godot-web-inputs/controller-earned/${input.fixture}`);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (input.bytes !== bytes.length || input.sha256 !== digest || !item.imports?.some(actual => actual.filename === input.fixture && actual.sha256 === digest && actual.bytes === bytes.length)) throw Error(`Library browser did not import exact earned bytes: ${input.fixture}`);
          }
          for (const stage of ['library-rule-entry', 'library-rule-reviewed', 'library-handoff']) {
            const screenshot = item.screenshots?.find(file => file.path === `${item.id}-${stage}.png`);
            if (!screenshot || !Number.isSafeInteger(screenshot.bytes) || screenshot.bytes <= 0 || !/^[a-f0-9]{64}$/.test(screenshot.sha256)) throw Error('Missing actual library screenshots');
            const bytes = fs.readFileSync(`${directory}/${screenshot.path}`);
            if (bytes.length !== screenshot.bytes || createHash('sha256').update(bytes).digest('hex') !== screenshot.sha256) throw Error('Library screenshot bytes differ from browser evidence');
          }
          for (const suffix of ['unread library rule', 'library handoff']) {
            const label = `${item.id} ${suffix}`;
            if (!item.saveInputs?.some(input => input.label === label && input.dispatchCompleted === true && input.touch === item.touch && input.events?.length) || !item.saveAttempts?.some(attempt => attempt.label === label && !attempt.failedAt && attempt.completedAt && attempt.disk?.entries?.length)) throw Error(`Missing explicit saved/reloaded library boundary: ${label}`);
          }
          const receipt = {sourceCommit: report.exportManifest.sourceCommit, engine: report.exportManifest.engine, runnerSha256,
            inputBundle, inputs, cases: [{id: item.id, library, screenshots: item.screenshots}],
            scope: 'Controller-earned boundary imports plus actual Chromium unread-rule reopening, explicit reading, exact save/reload and original skip-to-arrival handoff. Not complete natural navigation through the bag, paper, librarian stamp or PASS chain; not physical-device proof.'};
          fs.writeFileSync(`${directory}/ci-library-receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

      - name: Preserve this profile's library evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-library-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            godot_native/exports/verification/verified-library-inputs.json
            godot_native/exports/verification/web_library/
          if-no-files-found: warn

      - name: Verify exact source and every phone input byte
        id: verify_phone_inputs
        if: ${{ !cancelled() && matrix.phone_profile != '' && steps.verify_inputs.outcome == 'success' }}
        run: |
          node godot_native/tools/web_acceptance_bundle.mjs verify \
            --bundle-dir "$RUNNER_TEMP/godot-web-inputs" \
            --receipt-sha "$EXPECTED_RECEIPT_SHA" \
            --producer-attempt "$EXPECTED_PRODUCER_ATTEMPT" \
            --output-receipt godot_native/exports/verification/verified-inputs.json

      - name: Accept actual early charging and two-stage Tiyi phone input
        if: ${{ !cancelled() && matrix.phone_profile != '' && steps.verify_phone_inputs.outcome == 'success' }}
        env:
          ACCEPTANCE_PROFILE: ${{ matrix.phone_profile }}
          ACCEPTANCE_PHONE_GROUP: ${{ matrix.phone_group }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot_native/exports/verification/web_phone_recovery
          mkdir -p "$RUNNER_TEMP/godot-phone-qa-site"
          ln -s "$RUNNER_TEMP/godot-web-inputs/web-release" "$RUNNER_TEMP/godot-phone-qa-site/7-55"
          python3 -m http.server 5208 --bind 127.0.0.1 --directory "$RUNNER_TEMP/godot-phone-qa-site" > godot_native/exports/verification/web_phone_recovery/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:5208/7-55/build-manifest.json
          godot_web_chrome="${GODOT_WEB_CHROME:-${CHROME_BIN:-$(command -v google-chrome || command -v chromium || command -v chromium-browser)}}"
          node godot_native/tools/verify_web_export.mjs \
            --url http://127.0.0.1:5208/7-55/ \
            --export-dir "$RUNNER_TEMP/godot-web-inputs/web-release" \
            --output godot_native/exports/verification/web_phone_recovery \
            --scenarios phone-recovery --only "$ACCEPTANCE_PROFILE" \
            --phone-group "$ACCEPTANCE_PHONE_GROUP" \
            --fixtures "$RUNNER_TEMP/godot-web-inputs/controller-earned" \
            --chrome "$godot_web_chrome" \
            --chrome-arg --use-angle=swiftshader \
            --chrome-arg --enable-unsafe-swiftshader \
            --boot-timeout 180000 2>&1 | tee godot_native/exports/verification/web_phone_recovery/acceptance.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {phoneInputs, assertPhoneCoverage} from './godot_native/tools/web_phone_shards.mjs';
          const directory = 'godot_native/exports/verification/web_phone_recovery';
          const report = JSON.parse(fs.readFileSync(`${directory}/web-acceptance.json`, 'utf8'));
          const fixtures = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/godot-web-inputs/controller-earned/phone-recovery-inputs.json`, 'utf8'));
          const expected = [process.env.ACCEPTANCE_PROFILE];
          const group = process.env.ACCEPTANCE_PHONE_GROUP;
          const inputs = phoneInputs(fixtures, group);
          if (report.scenarios !== 'phone-recovery' || !report.passed || report.exportManifest?.sourceCommit !== process.env.GITHUB_SHA || report.exportManifest?.engine !== '4.7.1.stable.official' || JSON.stringify(report.cases.map(item => item.id).sort()) !== JSON.stringify(expected)) throw Error('Missing exact-source 4.7.1 phone recovery browser cases');
          const profile = { 'desktop-1280': [1280, 720, false, 1], 'touch-390': [390, 844, true, 1], 'retina-touch-390': [390, 844, true, 3] }[process.env.ACCEPTANCE_PROFILE];
          for (const item of report.cases) {
            if (JSON.stringify([item.width, item.height, item.touch, item.dpr]) !== JSON.stringify(profile)) throw Error(`Wrong actual phone profile: ${item.id}`);
            assertPhoneCoverage(item.phoneRecovery, group);
            if (!item.passed || !item.screenshots.length) throw Error(`Incomplete ordinary phone recovery evidence: ${item.id}`);
            if (!inputs.every(input => item.imports.some(actual => actual.filename === input.filename && actual.sha256 === input.sha256))) throw Error(`Unverified phone recovery import bytes: ${item.id}`);
          }
          const receipt = {group, sourceCommit: report.exportManifest.sourceCommit, engine: report.exportManifest.engine,
            runnerSha256: report.runnerSha256, phoneRecoveryRunnerSha256: report.phoneRecoveryRunnerSha256,
            inputBundle: JSON.parse(fs.readFileSync('godot_native/exports/verification/verified-inputs.json', 'utf8')),
            inputs, cases: report.cases.map(item => ({id: item.id, group, coverage: item.phoneRecovery.coverage, screenshots: item.screenshots})),
            scope: 'Actual ordinary Chromium inputs, imports and reload against the Godot WASM export. Low-battery legacy inputs are explicit compatibility constructions; no physical-device or four-chapter manual playthrough claim.'};
          fs.writeFileSync(`${directory}/ci-phone-recovery-receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

      - name: Preserve this phone group's browser evidence
        if: ${{ always() && matrix.phone_profile != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-phone-${{ matrix.phone_profile }}-${{ matrix.phone_group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            godot_native/exports/verification/verified-inputs.json
            godot_native/exports/verification/web_phone_recovery/
          if-no-files-found: warn

  browser_flc:
    name: Godot Web FLC activity (${{ matrix.profile }})
    if: ${{ !cancelled() && needs.build.outputs.bundle_ready == 'true' }}
    needs: [build, browser_contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [desktop-1280, touch-390]
    env:
      ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      EXPECTED_RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
      EXPECTED_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
      ACCEPTANCE_PROFILE: ${{ matrix.profile }}
    steps:

      - name: Check out exact producer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: godot_native/tools

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Download this run's sealed producer inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: ${{ runner.temp }}/godot-web-inputs

      - name: Verify exact source and every input byte
        run: |
          node godot_native/tools/web_acceptance_bundle.mjs verify \
            --bundle-dir "$RUNNER_TEMP/godot-web-inputs" \
            --receipt-sha "$EXPECTED_RECEIPT_SHA" \
            --producer-attempt "$EXPECTED_PRODUCER_ATTEMPT" \
            --output-receipt godot_native/exports/verification/verified-flc-inputs.json

      - name: Accept ordinary FLC entry object save and reload
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot_native/exports/verification/web_flc
          python3 -m http.server 5209 --bind 127.0.0.1 --directory "$RUNNER_TEMP/godot-web-inputs/web-release" > godot_native/exports/verification/web_flc/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:5209/build-manifest.json
          godot_web_chrome="$(command -v google-chrome || command -v chromium)"
          node godot_native/tools/verify_web_export.mjs \
            --url http://127.0.0.1:5209/ \
            --export-dir "$RUNNER_TEMP/godot-web-inputs/web-release" \
            --output godot_native/exports/verification/web_flc \
            --only "$ACCEPTANCE_PROFILE" --scenarios flc-activity \
            --chrome "$godot_web_chrome" \
            --chrome-arg --use-angle=swiftshader \
            --chrome-arg --enable-unsafe-swiftshader \
            --boot-timeout 180000 2>&1 | tee godot_native/exports/verification/web_flc/acceptance.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('godot_native/exports/verification/web_flc/web-acceptance.json','utf8'));
          if(!report.passed || report.scenarios!=='flc-activity' || report.exportManifest?.sourceCommit!==process.env.GITHUB_SHA || report.cases.length!==1 || report.cases[0].id!==process.env.ACCEPTANCE_PROFILE || !report.cases[0].flcActivity?.completed) throw Error('Missing exact-source FLC ordinary-input and persisted reload evidence');
          NODE

      - name: Preserve FLC browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-flc-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            godot_native/exports/verification/verified-flc-inputs.json
            godot_native/exports/verification/web_flc/
          if-no-files-found: warn

  browser_coverage:
    name: Verify complete exact-source Web coverage
    if: ${{ !cancelled() }}
    needs: [build, browser_contracts, browser_baseline, browser_streaming, browser_profiles, phone_profiles, library_profiles, browser_flc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      EXPECTED_RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
      EXPECTED_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
      ACCEPTANCE_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every producer and consumer job
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.ACCEPTANCE_JOB_RESULTS);
          const expected = ['build', 'browser_contracts', 'browser_baseline', 'browser_streaming', 'browser_profiles', 'phone_profiles', 'library_profiles', 'browser_flc'];
          if (JSON.stringify(Object.keys(needs).sort()) !== JSON.stringify(expected.sort()) || expected.some(name => needs[name].result !== 'success')) throw Error('Every Web producer and consumer job must succeed');
          NODE
      - name: Check out exact validator source only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: godot_native/tools
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Download baseline evidence
        uses: actions/download-artifact@v4
        with:
          pattern: godot-web-baseline-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/godot-web-evidence
          merge-multiple: false
      - name: Download streaming evidence
        uses: actions/download-artifact@v4
        with:
          pattern: godot-web-streaming-${{ github.run_id }}-*
          path: ${{ runner.temp }}/godot-web-evidence
          merge-multiple: false
      - name: Download world evidence
        uses: actions/download-artifact@v4
        with:
          pattern: godot-web-world-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/godot-web-evidence
          merge-multiple: false
      - name: Download phone evidence
        uses: actions/download-artifact@v4
        with:
          pattern: godot-web-phone-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/godot-web-evidence
          merge-multiple: false
      - name: Download library evidence
        uses: actions/download-artifact@v4
        with:
          pattern: godot-web-library-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/godot-web-evidence
          merge-multiple: false
      - name: Verify exhaustive browser coverage and shared provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {assertPhoneCoverage, assertPhoneShardUnion} from './godot_native/tools/web_phone_shards.mjs';
          const equal = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const requireValue = (value, message) => { if (!value) throw Error(message); };
          const run = process.env.GITHUB_RUN_ID, attempt = process.env.GITHUB_RUN_ATTEMPT;
          const expectedSource = {event: process.env.GITHUB_EVENT_NAME, head: process.env.ACCEPTANCE_HEAD_SHA,
            base: process.env.ACCEPTANCE_BASE_SHA || null, checkedOutCommit: process.env.GITHUB_SHA,
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim(), run,
            attempt: process.env.EXPECTED_PRODUCER_ATTEMPT, dirty: false};
          requireValue(execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim() === expectedSource.checkedOutCommit, 'Aggregate checkout differs from trigger');
          requireValue(/^[a-f0-9]{64}$/.test(process.env.EXPECTED_RECEIPT_SHA || '') && /^[1-9][0-9]*$/.test(expectedSource.attempt || '') && Number(expectedSource.attempt) <= Number(attempt), 'Missing trusted producer output');
          const root = path.join(process.env.RUNNER_TEMP, 'godot-web-evidence');
          const profiles = ['desktop-1280', 'touch-390', 'retina-touch-390'];
          const dimensions = {'desktop-1280': [1280,720,false,1], 'desktop-1440': [1440,900,false,1], 'touch-390': [390,844,true,1], 'retina-1440': [1440,900,false,2], 'retina-touch-390': [390,844,true,3], 'desktop-1920': [1920,1080,false,1]};
          const plan = [];
          const add = (key, bundle, receipt, cases) => plan.push({key, bundle, receipt, cases});
          for (const [batch, ids] of Object.entries({standard: ['desktop-1280','touch-390','retina-1440'], wide: ['desktop-1440','retina-touch-390','desktop-1920']})) add(`baseline-${batch}`, 'verified-baseline-inputs.json', 'web_ci/ci-baseline-receipt.json', ids.map(id => [`web_ci/${id}/web-acceptance.json`, id, 'all']));
          add('streaming', 'verified-streaming-inputs.json', 'web_streaming/ci-streaming-receipt.json', [['web_streaming/web-acceptance.json','desktop-1280','streaming']]);
          for (const id of profiles) add(`world-${id}`, 'verified-inputs.json', 'web_mobile_world/ci-mobile-world-receipt.json', [['web_mobile_world/web-acceptance.json',id,'mobile-world']]);
          for (const [id, group] of [['desktop-1280','all'],['touch-390','all'],['retina-touch-390','charging'],['retina-touch-390','c1-tiyi'],['retina-touch-390','c2-tiyi']]) add(`phone-${id}-${group}`, 'verified-inputs.json', 'web_phone_recovery/ci-phone-recovery-receipt.json', [['web_phone_recovery/web-acceptance.json',id,'phone-recovery',group]]);
          for (const id of ['desktop-1280','touch-390']) add(`library-${id}`, 'verified-library-inputs.json', 'web_library/ci-library-receipt.json', [['web_library/web-acceptance.json',id,'library']]);
          // A failed-only rerun keeps successful jobs' older same-run evidence.
          // Select the newest artifact per fixed consumer key, never a successful
          // fallback behind a newer failed report. Producer/source/hash identity
          // remains exact, so rerunning the producer invalidates older inputs.
          const selected = new Map();
          for (const name of fs.readdirSync(root)) {
            const item = plan.find(candidate => name.startsWith(`godot-web-${candidate.key}-${run}-`));
            requireValue(item, `Unknown browser artifact: ${name}`);
            const producerPrefix = `godot-web-${item.key}-${run}-`, consumerAttempt = name.slice(producerPrefix.length);
            requireValue(/^[1-9][0-9]*$/.test(consumerAttempt) && Number.isSafeInteger(Number(consumerAttempt)) && Number(consumerAttempt) <= Number(attempt), `Invalid/future artifact attempt: ${name}`);
            const previous = selected.get(item.key);
            requireValue(!previous || previous.consumerAttempt !== consumerAttempt, `Duplicate consumer key/attempt: ${name}`);
            if (!previous || Number(consumerAttempt) > Number(previous.consumerAttempt)) selected.set(item.key, {name, consumerAttempt});
          }
          requireValue(selected.size === plan.length, 'Missing browser consumer artifact');
          const names = plan.map(item => selected.get(item.key).name);
          const digest = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const runnerSha256 = digest('godot_native/tools/verify_web_export.mjs');
          const phoneSha256 = digest('godot_native/tools/web_phone_recovery.mjs');
          const phoneShardSha256 = digest('godot_native/tools/web_phone_shards.mjs');
          const retina = [], covered = []; let commonBundle;
          for (const [index, item] of plan.entries()) {
            const folder = path.join(root, names[index]), consumerAttempt = selected.get(item.key).consumerAttempt;
            const read = relative => JSON.parse(fs.readFileSync(path.join(folder, relative), 'utf8'));
            const bundle = read(item.bundle), receipt = read(item.receipt);
            requireValue(bundle.verified === true && equal(bundle.source, expectedSource) && bundle.receiptSha === process.env.EXPECTED_RECEIPT_SHA && bundle.producerAttempt === expectedSource.attempt && bundle.consumerAttempt === consumerAttempt, `Different source/run/attempt or unverified bytes: ${item.key}`);
            const {consumerAttempt: _consumerAttempt, ...sealedBundle} = bundle;
            if (!commonBundle) commonBundle = sealedBundle;
            requireValue(equal(sealedBundle, commonBundle) && equal(receipt.inputBundle, bundle) && receipt.sourceCommit === expectedSource.checkedOutCommit, `Different sealed inventory or receipt: ${item.key}`);
            const ids = item.cases.map(row => row[1]);
            requireValue(item.key === 'streaming' ? receipt.case === 'desktop-1280' && receipt.verified?.length === 4 : equal(receipt.cases?.map(row => row.id), ids), `Missing scenario receipt cases: ${item.key}`);
            for (const [file, id, scenario, group] of item.cases) {
              const report = read(file), c = report.cases?.[0];
              requireValue(report.passed === true && report.scenarios === scenario && report.runnerSha256 === runnerSha256 && report.exportManifest?.sourceCommit === expectedSource.checkedOutCommit && report.exportManifest?.engine === '4.7.1.stable.official' && report.cases?.length === 1 && c.id === id && c.passed === true && equal([c.width,c.height,c.touch,c.dpr], dimensions[id]) && c.renderer?.webgl2 === true, `Wrong or incomplete real browser case: ${item.key}/${id}`);
              requireValue(Array.isArray(report.checks) && report.checks.length > 0 && report.checks.every(check => check.ok === true) && Array.isArray(report.errors) && report.errors.length === 0, `Missing or failed browser assertions: ${item.key}`);
              if (scenario === 'phone-recovery') {
                requireValue(report.phoneRecoveryRunnerSha256 === phoneSha256 && report.phoneShardRunnerSha256 === phoneShardSha256 && receipt.group === group && receipt.cases[0].group === group && equal(receipt.cases[0].coverage, c.phoneRecovery?.coverage), 'Different phone runner/group evidence');
                assertPhoneCoverage(c.phoneRecovery, group);
                if (id === 'retina-touch-390') retina.push(c.phoneRecovery);
              }
              covered.push({id, scenario, consumerAttempt, ...(group ? {group} : {})});
            }
          }
          assertPhoneShardUnion(retina);
          requireValue(covered.length === 17, 'Browser coverage count differs');
          fs.mkdirSync('godot_native/exports/verification', {recursive:true});
          fs.writeFileSync('godot_native/exports/verification/web-coverage.json', JSON.stringify({passed:true, source:expectedSource, inputBundle:commonBundle, artifacts:names, covered, scope:'Exhaustive existing automated browser gates; not manual or physical-device acceptance.'}, null, 2) + '\n');
          console.log(`Exact-source Web coverage PASS: ${names.length} consumer artifacts; ${covered.length} browser reports; all nine phone gates for every original phone profile.`);
          NODE
      - name: Preserve exhaustive coverage receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-web-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: godot_native/exports/verification/web-coverage.json
          if-no-files-found: warn
  deploy:
    name: Publish Godot Web game
    if: ${{ needs.build.result == 'success' && needs.browser_contracts.result == 'success' && needs.browser_baseline.result == 'success' && needs.browser_streaming.result == 'success' && needs.browser_profiles.result == 'success' && needs.phone_profiles.result == 'success' && needs.library_profiles.result == 'success' && needs.browser_flc.result == 'success' && needs.browser_coverage.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/godot-complete-20261019') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browser_contracts, browser_baseline, browser_streaming, browser_profiles, phone_profiles, library_profiles, browser_flc, browser_coverage]
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
