name: FLC placed lounge and laboratory assets

on:
  pull_request:
    paths:
      - 'godot_native/art_source/future_learning_center_3d/**'
      - '.github/workflows/flc-placed-assets-browser.yml'
  push:
    branches: [main]
    paths:
      - 'godot_native/art_source/future_learning_center_3d/**'
      - '.github/workflows/flc-placed-assets-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: godot_native/art_source/future_learning_center_3d

env:
  TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Additive preview acceptance only. Does not replace photo, workstation,
# spatial, native Godot, source Blender or published gameplay checks.
jobs:
  placed-assets-browser:
    name: Placed assets Chromium desktop and simulated mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize fresh run evidence
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/flc-placed-assets"
          printf 'test_head=%s\nrun_id=%s\nrun_attempt=%s\nscope=Actual Chromium WebGL desktop and simulated mobile; not physical-device acceptance\n' \
            "$TEST_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/flc-placed-assets/context.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: godot_native/art_source/future_learning_center_3d
      - name: Exclude historical receipts and verify tested head
        run: |
          rm -rf review/placed_assets_browser
          mkdir -p review/placed_assets_browser
          git rev-parse HEAD | tee "$RUNNER_TEMP/flc-placed-assets/checkout-sha.txt"
          test "$(git rev-parse HEAD)" = "$TEST_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: godot_native/art_source/future_learning_center_3d/browser_tests/package-lock.json
      - name: Install locked browser harness
        run: npm ci --prefix browser_tests --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium runtime
        run: node browser_tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Accept resident assets through ordinary pointer and touch paths
        run: node browser_tests/placed_assets_browser.mjs 2>&1 | tee "$RUNNER_TEMP/flc-placed-assets/test.log"
      - name: Preserve report, screenshots, traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flc-placed-assets-chromium
          path: |
            ${{ runner.temp }}/flc-placed-assets/
            godot_native/art_source/future_learning_center_3d/review/placed_assets_browser/
          if-no-files-found: error

  placed-assets-node:
    name: Placed assets actual GLB geometry and collision contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize fresh Node evidence
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/flc-placed-assets-node"
          printf 'test_head=%s\nrun_id=%s\nrun_attempt=%s\nscope=Actual uncompressed GLB geometry and collision contracts; not browser acceptance\n' \
            "$TEST_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/flc-placed-assets-node/context.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: godot_native/art_source/future_learning_center_3d
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This contract uses only Node built-ins and the checked-in Three.js
      # runtime, matching the existing photo-node contracts. No npm install.
      - name: Accept both actual building GLBs and permanent composition geometry
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/flc-placed-assets-node/checkout-sha.txt"
          test "$(git rev-parse HEAD)" = "$TEST_HEAD_SHA"
          rm -f review/placed-assets-node.json review/lounge-room-node.json
          mkdir -p review
          node scripts/test_placed_assets.mjs 2>&1 | tee "$RUNNER_TEMP/flc-placed-assets-node/test.log"
      - name: Preserve Node contract report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flc-placed-assets-actual-glb
          path: |
            ${{ runner.temp }}/flc-placed-assets-node/
            godot_native/art_source/future_learning_center_3d/review/placed-assets-node.json
            godot_native/art_source/future_learning_center_3d/review/lounge-room-node.json
          if-no-files-found: error
