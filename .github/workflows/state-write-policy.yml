name: State write policy
on:
  pull_request:
    paths:
      - "src/core/**"
      - "scripts/verify-state-write-policy.mjs"
      - ".github/workflows/state-write-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dynamic boundary and stress tests
        run: node scripts/verify-state-write-policy.mjs
      - name: Static repository type review
        run: npm run typecheck
