name: Qizhen Blender nearshore sample

on:
  pull_request:
    paths:
      - 'examples/qizhen_blender_nearshore/**'
      - '.github/workflows/qizhen-blender-nearshore.yml'

permissions:
  contents: read

jobs:
  isolated-nearshore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matches repository CI
      - name: Verify frozen sample hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('examples/qizhen_blender_nearshore')
          for relative, expected in json.loads((base / 'verification/files.json').read_text()).items():
              path = base / relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, str(path)
          print('All frozen sample hashes match')
          PY
      - name: Install pinned official Godot 4.7.1
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import isolated GLB project
        run: |
          godot --headless --editor --path examples/qizhen_blender_nearshore/preview --import --quit 2>&1 | tee "$RUNNER_TEMP/nearshore-import.log"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/nearshore-import.log"
      - name: Test sample, unchanged full route, and input-camera contracts
        run: |
          for suite in test_blender_sample test_sample_route test_large_world audit_large_world test_input_camera test_route_30hz; do
            godot --headless --path examples/qizhen_blender_nearshore/preview --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/$suite.log"
          done
