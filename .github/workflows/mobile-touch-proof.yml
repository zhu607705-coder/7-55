name: Native mobile touch proof
on:
  push:
    branches: [codex/mobile-touch-controls-20261022, codex/mobile-bottom-hint-20261022]
    paths: ['godot_native/**', '.github/workflows/mobile-touch-proof.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned official renderer
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Import actual assets and run routed touch regression
        run: |
          node godot_native/tools/sync_source.mjs
          GODOT_TEST_REPORT=mobile-touch-test-report.json node godot_native/tools/validate_native.mjs --filter 'Godot asset import and editor parse|Native phone icon source parity|test_phone_symbol_icons.gd|test_phone_launcher_icons.gd|test_phone_chrome.gd|test_mobile_direct_touch.gd|test_portrait_exploration.gd|test_mobile_world_feedback.gd|test_mobile_floor_room204_drag.gd|test_inventory_touch_ownership.gd|test_collapsed_inventory_focus.gd'
          node godot_native/tools/test_phone_icon_pack.mjs
      - name: Capture actual compact game viewport and existing overlays
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d /tmp/755-mobile-touch-XXXXXX)
          mkdir -p "$sandbox"/{data,config,cache,state}
          export XDG_DATA_HOME="$sandbox/data" XDG_CONFIG_HOME="$sandbox/config"
          export XDG_CACHE_HOME="$sandbox/cache" XDG_STATE_HOME="$sandbox/state"
          export GODOT_TEST_USER_DATA_DIR="$sandbox/data/SevenFiftyFiveNative"
          mkdir -p "$GODOT_TEST_USER_DATA_DIR"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/mobile-touch-proof"
          mkdir -p "$UI_CAPTURE_DIR"
          git rev-parse HEAD > "$UI_CAPTURE_DIR/source-sha.txt"
          timeout 240 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_mobile_direct_touch.gd 2>&1 | tee "$UI_CAPTURE_DIR/render.log"
          test -f "$UI_CAPTURE_DIR/mobile-touch-captures.json"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:|^ERROR:' "$UI_CAPTURE_DIR/render.log"
      - name: Capture restored source phone icons separately
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d /tmp/755-phone-icons-XXXXXX)
          mkdir -p "$sandbox"/{data,config,cache,state}
          export XDG_DATA_HOME="$sandbox/data" XDG_CONFIG_HOME="$sandbox/config"
          export XDG_CACHE_HOME="$sandbox/cache" XDG_STATE_HOME="$sandbox/state"
          export GODOT_TEST_USER_DATA_DIR="$sandbox/data/SevenFiftyFiveNative"
          mkdir -p "$GODOT_TEST_USER_DATA_DIR"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/phone-icon-proof"
          export PHONE_ICON_SOURCE_REQUIRED=1
          mkdir -p "$UI_CAPTURE_DIR"
          git rev-parse HEAD > "$UI_CAPTURE_DIR/source-sha.txt"
          godot --version > "$UI_CAPTURE_DIR/engine-version.txt"
          timeout 180 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_phone_symbols.gd 2>&1 | tee "$UI_CAPTURE_DIR/render.log"
          test -f "$UI_CAPTURE_DIR/symbol-captures.json"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:|^ERROR:' "$UI_CAPTURE_DIR/render.log"
          node -e 'const fs=require("node:fs");const rows=JSON.parse(fs.readFileSync("phone-icon-proof/symbol-captures.json","utf8"));if(rows.length!==27||rows.some(x=>x.validation_only||x.error!==0))throw Error("Expected27 actual DEV-fixture PNG captures, not earned-campaign or headless proof");for(const r of rows)if(!fs.existsSync("phone-icon-proof/"+r.id+".png"))throw Error(r.id);'
      - name: Capture existing recovered phone reading fixtures
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d /tmp/755-reading-proof-XXXXXX)
          mkdir -p "$sandbox"/{data,config,cache,state}
          export XDG_DATA_HOME="$sandbox/data" XDG_CONFIG_HOME="$sandbox/config"
          export XDG_CACHE_HOME="$sandbox/cache" XDG_STATE_HOME="$sandbox/state"
          export GODOT_TEST_USER_DATA_DIR="$sandbox/data/SevenFiftyFiveNative"
          mkdir -p "$GODOT_TEST_USER_DATA_DIR"
          export UI_CAPTURE_DIR="$GITHUB_WORKSPACE/reading-ui-proof"
          mkdir -p "$UI_CAPTURE_DIR"
          git rev-parse HEAD > "$UI_CAPTURE_DIR/source-sha.txt"
          godot --version > "$UI_CAPTURE_DIR/engine-version.txt"
          timeout 180 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' godot --audio-driver Dummy --path godot_native --script res://tests/capture_ui_redesign.gd 2>&1 | tee "$UI_CAPTURE_DIR/render.log"
          test -f "$UI_CAPTURE_DIR/captures.json"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Screenshot failed:|^ERROR:' "$UI_CAPTURE_DIR/render.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const directory = 'reading-ui-proof';
          const sourceCommit = fs.readFileSync(`${directory}/source-sha.txt`, 'utf8').trim();
          const engine = fs.readFileSync(`${directory}/engine-version.txt`, 'utf8').trim();
          const rows = JSON.parse(fs.readFileSync(`${directory}/captures.json`, 'utf8'));
          if (sourceCommit !== process.env.GITHUB_SHA || !engine.startsWith('4.7.1.stable.official') || !Array.isArray(rows) || !rows.length) throw Error('Missing exact-source official reading captures');
          const required = ['1440x900', '390x844'].flatMap(size => ['c35_recovery', 'c35_network', 'c35_voice'].map(page => `${size}-${page}`));
          if (required.some(id => rows.filter(row => row.id === id).length !== 1)) throw Error('Missing or duplicate recovered reading fixture');
          const images = rows.map(row => {
            if (row.validation_only || row.error !== 0 || !Number.isInteger(row.width) || row.width <= 0 || !Number.isInteger(row.height) || row.height <= 0 || !/^[a-zA-Z0-9_-]+$/.test(row.id)) throw Error('Not an actual successful reading PNG');
            const bytes = fs.readFileSync(`${directory}/${row.id}.png`);
            if (bytes.length <= 24 || bytes.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' || bytes.readUInt32BE(16) !== row.width || bytes.readUInt32BE(20) !== row.height) throw Error('Reading PNG dimensions or bytes disagree');
            return {...row, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex')};
          });
          fs.writeFileSync(`${directory}/ci-reading-receipt.json`, JSON.stringify({sourceCommit, engine, images,
            scope: 'Existing DEV fixtures rendered with the production renderer. Covers recovered reading pages, not earned campaign completion, dedicated catalogue geometry, or physical-device proof.'}, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-touch-proof
          path: |
            mobile-touch-proof/
            phone-icon-proof/
            reading-ui-proof/
            mobile-touch-test-report.json
            mobile-touch-test-report.json.meta.json
          if-no-files-found: error
