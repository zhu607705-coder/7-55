name: Qizhen large-world example

on:
  pull_request:
    paths:
      - 'examples/qizhen_large_world/**'
      - '.github/workflows/qizhen-large-world-example.yml'

permissions:
  contents: read

jobs:
  isolated-example:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matches repository CI
      - name: Install official Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          echo "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import isolated project
        run: |
          godot --headless --editor --path examples/qizhen_large_world --import --quit 2>&1 | tee "$RUNNER_TEMP/qizhen-import.log"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/qizhen-import.log"
      - name: Test model, 41-check audit, and 30 Hz route
        run: |
          for suite in test_large_world audit_large_world test_route_30hz; do
            godot --headless --path examples/qizhen_large_world --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/$suite.log"
          done
