name: Product change scope
on:
  workflow_call:
    outputs:
      game:
        value: ${{ jobs.scope.outputs.game }}
      platform:
        value: ${{ jobs.scope.outputs.platform }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.paths.outputs.game }}
      platform: ${{ steps.paths.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: paths
        run: node .github/scripts/product-scope.mjs
      - name: Verify product classification
        run: node --test .github/scripts/product-scope.test.mjs
