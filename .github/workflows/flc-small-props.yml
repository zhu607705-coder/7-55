name: FLC prop and lab-equipment asset contracts
on:
  pull_request:
    paths:
      - 'godot_native/art_source/future_learning_center_3d/**'
      - '.github/workflows/flc-small-props.yml'
  push:
    branches: [main]
    paths:
      - 'godot_native/art_source/future_learning_center_3d/**'
      - '.github/workflows/flc-small-props.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: godot_native/art_source/future_learning_center_3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: godot_native/art_source/future_learning_center_3d/pipeline/package-lock.json
      - name: Install locked asset decoder dependencies
        run: npm ci --prefix pipeline --no-audit --no-fund
      - name: Verify actual geometry, dimensions, materials and retained collision
        run: |
          node scripts/test_collision.mjs
          python3 scripts/validate_floor_materials.py
          node pipeline/validate_asset.mjs
          node pipeline/test_table_dimensions.mjs
          node pipeline/test_small_props.mjs
          node pipeline/test_lab_tools.mjs
          node pipeline/test_default_precision.mjs
      - name: Preserve current-source asset receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flc-small-prop-contracts
          path: |
            godot_native/art_source/future_learning_center_3d/review/small_props/validation.json
            godot_native/art_source/future_learning_center_3d/review/table_dimension_validation.json
            godot_native/art_source/future_learning_center_3d/review/lab_tools/validation.json
            godot_native/art_source/future_learning_center_3d/review/lab_tools/default_pipeline_regression.json
          if-no-files-found: error
